<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4facfe,#00c6fb);
}

.card{
    width:320px;
    background:white;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card h2{
    color:#1d4ed8;
    margin-bottom:10px;
}

.card p{
    color:#555;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #93c5fd;
    border-radius:10px;
    font-size:16px;
    outline:none;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-bottom:10px;
}

button:hover{
    background:#1e40af;
}

#message{
    font-weight:bold;
    margin:10px 0;
}

#score{
    color:#047857;
    font-weight:bold;
}

#restart{
    background:#64748b;
}
</style>

</head>
<body>

<div class="card">
    <h2>🎯 Number Guessing</h2>

    <p>Guess a number (1 - 10)</p>

    <input type="number" id="guess" placeholder="Enter number">

    <button onclick="checkGuess()">Check Guess</button>

    <h3 id="message">Start the Game 👇</h3>

    <p id="score">⭐ Score : 10</p>

    <button id="restart" onclick="newGame()">New Game</button>
</div>

<script>

let randomNumber=Math.floor(Math.random()*10)+1;
let score=10;

function checkGuess(){

    let userGuess=Number(document.getElementById("guess").value);

    if(userGuess<1 || userGuess>10){
        document.getElementById("message").innerHTML="⚠ Enter 1 to 10";
        return;
    }

    if(userGuess===randomNumber){
        document.getElementById("message").innerHTML="🎉 Correct! You Win";
    }
    else if(userGuess>randomNumber){
        score--;
        document.getElementById("message").innerHTML="📈 Too High";
    }
    else{
        score--;
        document.getElementById("message").innerHTML="📉 Too Low";
    }

    document.getElementById("score").innerHTML="⭐ Score : "+score;

    if(score===0){
        document.getElementById("message").innerHTML=
        "💥 Game Over! Number = "+randomNumber;
    }

    document.getElementById("guess").value="";
}

function newGame(){
    randomNumber=Math.floor(Math.random()*10)+1;
    score=10;
    document.getElementById("message").innerHTML="Start the Game 👇";
    document.getElementById("score").innerHTML="⭐ Score : 10";
    document.getElementById("guess").value="";
}

</script>

</body>
</html>
